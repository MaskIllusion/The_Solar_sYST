<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Explorer PRO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #050510;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(5, 5, 16, 0.9);
            backdrop-filter: blur(20px);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            gap: 8px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b35, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo i {
            -webkit-text-fill-color: #ff6b35;
            font-size: 24px;
        }

        .nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #888;
            padding: 6px 14px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
            font-family: inherit;
        }

        .nav-btn:hover {
            background: rgba(255, 107, 53, 0.12);
            border-color: #ff6b35;
            color: #fff;
            transform: translateY(-1px);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #ff6b35, #ffd700);
            border-color: #ff6b35;
            color: #fff;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 3px 3px 3px 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: #ff6b35;
            box-shadow: 0 0 25px rgba(255, 107, 53, 0.08);
        }

        #searchInput {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 12px;
            padding: 5px 0;
            width: 130px;
            font-family: inherit;
        }

        #searchInput::placeholder {
            color: #444;
        }

        #searchBtn {
            background: linear-gradient(135deg, #ff6b35, #ffd700);
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
        }

        #searchBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .info-panel {
            position: fixed;
            right: -460px;
            top: 65px;
            width: 420px;
            max-height: calc(100vh - 80px);
            background: rgba(8, 8, 24, 0.94);
            backdrop-filter: blur(30px);
            border-radius: 18px 0 0 18px;
            border-left: 2px solid rgba(255, 107, 53, 0.2);
            padding: 24px;
            z-index: 100;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -20px 0 60px rgba(0, 0, 0, 0.9);
            overflow-y: auto;
        }

        .info-panel.active {
            right: 0;
        }

        .info-panel::-webkit-scrollbar {
            width: 3px;
        }

        .info-panel::-webkit-scrollbar-thumb {
            background: #ff6b35;
            border-radius: 10px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .panel-header h2 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .close-panel {
            background: none;
            border: none;
            color: #555;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px;
        }

        .close-panel:hover {
            color: #fff;
            transform: rotate(90deg);
        }

        .object-icon {
            text-align: center;
            font-size: 60px;
            margin: 8px 0 16px;
        }

        .object-icon i {
            filter: drop-shadow(0 0 30px rgba(255, 107, 53, 0.2));
        }

        .object-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 14px 0;
            padding: 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 9px;
            text-transform: uppercase;
            color: #555;
            letter-spacing: 1.2px;
            font-weight: 600;
        }

        .detail-value {
            font-size: 14px;
            font-weight: 600;
            margin-top: 3px;
            color: #eee;
        }

        .object-description {
            margin: 12px 0;
            padding: 14px;
            background: rgba(255, 107, 53, 0.04);
            border-radius: 10px;
            border-left: 3px solid #ff6b35;
            line-height: 1.6;
            color: #bbb;
            font-size: 13px;
        }

        .object-facts {
            margin-top: 14px;
        }

        .object-facts h4 {
            color: #ffd700;
            margin-bottom: 10px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #factsList {
            list-style: none;
            padding: 0;
        }

        #factsList li {
            padding: 7px 12px;
            margin-bottom: 5px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            color: #aaa;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        #factsList li::before {
            content: "✦";
            color: #ffd700;
            font-size: 11px;
        }

        .speed-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(5, 5, 16, 0.9);
            backdrop-filter: blur(15px);
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .speed-control label {
            font-size: 10px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        #speedSlider {
            width: 80px;
            height: 3px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #ff6b35, #ffd700);
            border-radius: 2px;
            outline: none;
        }

        #speedSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ff6b35;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        #speedValue {
            font-weight: 700;
            color: #ffd700;
            min-width: 28px;
            font-size: 13px;
        }

        .hint {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            color: rgba(255, 255, 255, 0.12);
            font-size: 12px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 16px;
            border-radius: 16px;
            backdrop-filter: blur(5px);
            pointer-events: none;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .stats {
            position: fixed;
            top: 70px;
            left: 20px;
            z-index: 50;
            color: rgba(255, 255, 255, 0.15);
            font-size: 11px;
            pointer-events: none;
            font-family: monospace;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .header {
                padding: 8px 12px;
            }
            .logo {
                font-size: 16px;
            }
            .logo i {
                font-size: 20px;
            }
            .nav {
                order: 3;
                width: 100%;
                justify-content: center;
            }
            .nav-btn {
                font-size: 11px;
                padding: 4px 10px;
            }
            .search-box {
                width: 100%;
            }
            #searchInput {
                width: 100%;
            }
            .info-panel {
                width: 100%;
                right: -100%;
                top: 60px;
                border-radius: 18px 18px 0 0;
                max-height: calc(100vh - 60px);
                padding: 16px;
            }
            .info-panel.active {
                right: 0;
            }
            .speed-control {
                bottom: 12px;
                right: 12px;
                padding: 8px 12px;
            }
            #speedSlider {
                width: 50px;
            }
            .hint {
                display: none;
            }
            .stats {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .object-details {
                grid-template-columns: 1fr;
                gap: 6px;
            }
            .panel-header h2 {
                font-size: 20px;
            }
            .object-icon {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <i class="fas fa-rocket"></i>
            <span>Solar PRO</span>
        </div>
        <nav class="nav">
            <button class="nav-btn active" data-view="solar"><i class="fas fa-sun"></i> Система</button>
            <button class="nav-btn" data-view="orbit"><i class="fas fa-circle"></i> Орбиты</button>
            <button class="nav-btn" data-view="asteroids"><i class="fas fa-meteor"></i> Пояс</button>
            <button class="nav-btn" data-view="galaxy"><i class="fas fa-globe"></i> Обзор</button>
        </nav>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск...">
            <button id="searchBtn"><i class="fas fa-search"></i></button>
        </div>
    </header>

    <div id="canvas-container"></div>

    <div class="stats" id="stats">
        <div id="objectCount">Объектов: 0</div>
        <div id="fpsDisplay">FPS: 60</div>
    </div>

    <aside class="info-panel" id="infoPanel">
        <div class="panel-header">
            <h2 id="objectName">Космос</h2>
            <button class="close-panel" id="closePanel"><i class="fas fa-times"></i></button>
        </div>
        <div class="panel-content">
            <div class="object-icon" id="objectIcon">
                <i class="fas fa-globe" style="color: #ffd700;"></i>
            </div>
            <div class="object-details">
                <div class="detail-item">
                    <span class="detail-label">Тип</span>
                    <span class="detail-value" id="objectType">---</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Диаметр</span>
                    <span class="detail-value" id="objectDiameter">---</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Масса</span>
                    <span class="detail-value" id="objectMass">---</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Температура</span>
                    <span class="detail-value" id="objectTemp">---</span>
                </div>
            </div>
            <div class="object-description" id="objectDescription">
                Нажмите на объект для информации
            </div>
            <div class="object-facts">
                <h4><i class="fas fa-star" style="color: #ffd700;"></i> Факты</h4>
                <ul id="factsList">
                    <li>Исследуйте космос</li>
                    <li>Кликните по объекту</li>
                </ul>
            </div>
        </div>
    </aside>

    <div class="speed-control">
        <label>⏱</label>
        <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1">
        <span id="speedValue">1x</span>
    </div>

    <div class="hint">🖱 Вращайте · Скролл для зума · Клик для инфо</div>

        }, {

        const sunData = {
            name: 'Солнце',

            description: 'Центр нашей планетной системы. Составляет 99.86% всей массы Солнечной системы.',

        // ============ ПРИЛОЖЕНИЕ ============
        class SolarSystemApp {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.labelRenderer = null;
                this.controls = null;
                this.planets = [];
                this.moons = [];
                this.asteroids = [];
                this.sun = null;
                this.clock = new THREE.Clock();
                this.speed = 1;
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
                this.clickableObjects = [];
                this.totalObjects = 0;

                this.init();
                this.createScene();
                this.createLights();
                this.createStars();
                this.createSun();
                this.createPlanets();
                this.createAsteroidBelt();
                this.createOrbits();
                this.setupUI();
                this.animate();
            }

            init() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x050510);

                this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 600);
                this.camera.position.set(30, 22, 40);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.0;
                document.getElementById('canvas-container').appendChild(this.renderer.domElement);

                this.labelRenderer = new CSS2DRenderer();
                this.labelRenderer.setSize(window.innerWidth, window.innerHeight);
                this.labelRenderer.domElement.style.position = 'absolute';
                this.labelRenderer.domElement.style.top = '0';
                this.labelRenderer.domElement.style.left = '0';
                this.labelRenderer.domElement.style.pointerEvents = 'none';
                document.getElementById('canvas-container').appendChild(this.labelRenderer.domElement);

                this.controls = new OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.08;
                this.controls.minDistance = 3;
                this.controls.maxDistance = 250;
                this.controls.target.set(0, 0, 0);
                this.controls.maxPolarAngle = Math.PI / 1.8;

                window.addEventListener('resize', () => this.onResize());
                this.renderer.domElement.addEventListener('click', (e) => this.onClick(e));
                this.renderer.domElement.addEventListener('mousemove', (e) => this.onMouseMove(e));
            }

            createScene() {
                const ambient = new THREE.AmbientLight(0x222244, 0.3);
                this.scene.add(ambient);
                const hemi = new THREE.HemisphereLight(0x4466ff, 0x442200, 0.2);
                this.scene.add(hemi);
            }

            createLights() {
                const sunLight = new THREE.PointLight(0xffeedd, 2.5, 0, 0);
                sunLight.position.set(0, 0, 0);
                this.scene.add(sunLight);

                const fill = new THREE.DirectionalLight(0x4488cc, 0.2);
                fill.position.set(-10, 20, 20);
                this.scene.add(fill);

                const rim = new THREE.DirectionalLight(0x88aaff, 0.15);
                rim.position.set(10, -10, -20);
                this.scene.add(rim);

            createStars() {
                const geo = new THREE.BufferGeometry();

                const colors = new Float32Array(count * 3);
                for (let i = 0; i < count; i++) {
                    const r = 200 + Math.random() * 200;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                    pos[i * 3 + 1] = r * Math.cos(phi);
                    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
                    const c = new THREE.Color().setHSL(0.6 + Math.random() * 0.2, 0.2, 0.4 + Math.random() * 0.6);
                    colors[i * 3] = c.r;
                    colors[i * 3 + 1] = c.g;
                    colors[i * 3 + 2] = c.b;
                }
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                const mat = new THREE.PointsMaterial({
                    size: 0.4,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.8,
                    sizeAttenuation: true,
                    blending: THREE.AdditiveBlending
                });
                this.scene.add(new THREE.Points(geo, mat));

            createSun() {
                const geo = new THREE.SphereGeometry(2.8, 64, 64);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0xffaa33,
                    emissive: 0xff5500,
                    emissiveIntensity: 0.5,
                    roughness: 0.2,
                    metalness: 0.0
                });

                this.sun.userData = sunData;
                this.sun.userData.color = '#ffaa00';
                this.scene.add(this.sun);
                this.clickableObjects.push(this.sun);

                // Glow
                const glowGeo = new THREE.SphereGeometry(3.2, 32, 32);
                const glowMat = new THREE.MeshBasicMaterial({
                    color: 0xff6600,
                    transparent: true,
                    opacity: 0.12,
                    side: THREE.BackSide
                });
                this.sun.add(new THREE.Mesh(glowGeo, glowMat));

                // Corona particles
                const coronaGeo = new THREE.BufferGeometry();
                const coronaCount = 1000;
                const coronaPos = new Float32Array(coronaCount * 3);
                for (let i = 0; i < coronaCount; i++) {
                    const r = 2.9 + Math.random() * 2;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    coronaPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                    coronaPos[i * 3 + 1] = r * Math.cos(phi);
                    coronaPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
                }
                coronaGeo.setAttribute('position', new THREE.BufferAttribute(coronaPos, 3));
                const coronaMat = new THREE.PointsMaterial({
                    color: 0xffaa33,
                    size: 0.04,
                    transparent: true,
                    opacity: 0.3,
                    blending: THREE.AdditiveBlending

            createPlanets() {
                planetData.forEach((data) => {
                    const group = new THREE.Group();

                    // Текстура
                    const texture = this.createPlanetTexture(data);
                    const geo = new THREE.SphereGeometry(data.radius, 48, 48);
                    const mat = new THREE.MeshStandardMaterial({
                        map: texture,
                        roughness: data.roughness || 0.5,
                        metalness: data.metalness || 0.1,
                        emissive: new THREE.Color(data.color).multiplyScalar(0.05),
                    });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;

                    mesh.userData = {
                        name: data.name,
                        type: data.type,
                        diameter: data.diameter,
                        mass: data.mass,
                        temp: data.temp,
                        description: data.description,
                        facts: data.facts,
                        color: data.color,
                        distance: data.distance,
                        speed: data.speed,
                        angle: Math.random() * Math.PI * 2,
                        isPlanet: true
                    };

                    group.add(mesh);
                    this.clickableObjects.push(mesh);

                    // Атмосфера
                    if (data.hasAtmosphere) {
                        this.createAtmosphere(group, data);
                    }

                    // Кольца
                    if (data.hasRing) {
                        this.createRings(group, data);
                    }

                    // Спутники
                    if (data.moons && data.moons.length > 0) {
                        this.createMoons(group, data);
                    }

                    const angle = mesh.userData.angle || Math.random() * Math.PI * 2;
                    group.position.x = data.distance * Math.cos(angle);
                    group.position.z = data.distance * Math.sin(angle);

                    // Label
                    const label = this.createLabel(data.name);
                    label.position.set(0, data.radius * 1.5 + 0.3, 0);
                    group.add(label);

                    this.scene.add(group);
                    this.planets.push(group);
                    this.totalObjects += 1 + (data.moons ? data.moons.length : 0);
                });
                document.getElementById('objectCount').textContent = `Объектов: ${this.totalObjects}`;
            }

            createPlanetTexture(data) {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');

                const baseColor = new THREE.Color(data.color);

                // Gradient base
                const grad = ctx.createRadialGradient(256, 128, 10, 256, 128, 300);
                grad.addColorStop(0, baseColor.clone().multiplyScalar(1.3).getStyle());
                grad.addColorStop(0.5, baseColor.clone().multiplyScalar(0.9).getStyle());
                grad.addColorStop(1, baseColor.clone().multiplyScalar(0.5).getStyle());
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 256);

                // Bands for gas giants
                if (data.name === 'Юпитер' || data.name === 'Сатурн') {
                    for (let i = 0; i < 25; i++) {
                        const y = Math.random() * 256;
                        const h = 4 + Math.random() * 25;
                        const alpha = 0.1 + Math.random() * 0.3;
                        const c = baseColor.clone();
                        const v = (Math.random() - 0.5) * 0.3;
                        c.r = Math.max(0, Math.min(1, c.r + v));
                        c.g = Math.max(0, Math.min(1, c.g + v));
                        c.b = Math.max(0, Math.min(1, c.b + v));
                        ctx.fillStyle = c.getStyle();
                        ctx.globalAlpha = alpha;
                        ctx.fillRect(0, y, 512, h);
                    }
                    ctx.globalAlpha = 1;

                    // Jupiter's Great Red Spot
                    if (data.name === 'Юпитер') {
                        ctx.fillStyle = '#cc5533';
                        ctx.globalAlpha = 0.4;
                        ctx.beginPath();
                        ctx.ellipse(350, 160, 45, 25, 0.2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.globalAlpha = 1;
                    }
                }

                // Craters for rocky planets
                if (data.name === 'Меркурий' || data.name === 'Марс') {
                    for (let i = 0; i < 40 + Math.random() * 60; i++) {
                        const x = Math.random() * 512;
                        const y = Math.random() * 256;
                        const r = 2 + Math.random() * 15;
                        const dark = baseColor.clone().multiplyScalar(0.3 + Math.random() * 0.3);
                        ctx.beginPath();
                        ctx.arc(x, y, r, 0, Math.PI * 2);
                        ctx.fillStyle = dark.getStyle();
                        ctx.fill();
                        if (r > 5) {
                            ctx.beginPath();
                            ctx.arc(x + r * 0.25, y - r * 0.25, r * 0.25, 0, Math.PI * 2);
                            ctx.fillStyle = baseColor.clone().multiplyScalar(1.2).getStyle();
                            ctx.globalAlpha = 0.25;
                            ctx.fill();
                            ctx.globalAlpha = 1;
                        }
                    }
                }

                // Earth continents
                if (data.name === 'Земля') {
                    const continents = [
                        { x: 200, y: 85, w: 130, h: 100, c: '#3a8a3a' },
                        { x: 270, y: 135, w: 90, h: 55, c: '#4a8a3a' },
                        { x: 160, y: 145, w: 55, h: 45, c: '#3a7a3a' },
                        { x: 310, y: 75, w: 45, h: 65, c: '#4a7a4a' },
                        { x: 110, y: 105, w: 65, h: 75, c: '#3a8a4a' },
                        { x: 370, y: 125, w: 80, h: 55, c: '#4a8a4a' },
                        { x: 440, y: 85, w: 55, h: 75, c: '#3a7a4a' },
                        { x: 50, y: 65, w: 45, h: 45, c: '#3a7a3a' },
                    ];
                    continents.forEach(c => {
                        ctx.fillStyle = c.c;
                        ctx.beginPath();
                        for (let i = 0; i < 10; i++) {
                            const a = (i / 10) * Math.PI * 2;
                            const rx = (c.w / 2) * (0.6 + Math.random() * 0.4);
                            const ry = (c.h / 2) * (0.6 + Math.random() * 0.4);
                            const px = c.x + rx * Math.cos(a);
                            const py = c.y + ry * Math.sin(a);
                            i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                        }
                        ctx.closePath();
                        ctx.fill();
                    });
                    // Clouds
                    for (let i = 0; i < 50; i++) {
                        const x = Math.random() * 512;
                        const y = Math.random() * 256;
                        ctx.fillStyle = 'rgba(255,255,255,0.12)';
                        ctx.beginPath();
                        ctx.ellipse(x, y, 15 + Math.random() * 40, 8 + Math.random() * 20, Math.random() * Math.PI, 0, Math
                            .PI * 2);
                        ctx.fill();
                    }
                }

                // Venus clouds
                if (data.name === 'Венера') {
                    for (let i = 0; i < 60; i++) {
                        const x = Math.random() * 512;
                        const y = Math.random() * 256;
                        ctx.fillStyle = `rgba(255,200,100,${0.05 + Math.random() * 0.15})`;
                        ctx.beginPath();
                        ctx.ellipse(x, y, 20 + Math.random() * 60, 10 + Math.random() * 30, Math.random() * Math.PI, 0, Math
                            .PI * 2);
                        ctx.fill();
                    }
                }

                // Noise
                const imageData = ctx.getImageData(0, 0, 512, 256);
                const d = imageData.data;
                for (let i = 0; i < d.length; i += 4) {
                    const noise = (Math.random() - 0.5) * 12;
                    d[i] = Math.max(0, Math.min(255, d[i] + noise));
                    d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + noise));
                    d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + noise));
                }
                ctx.putImageData(imageData, 0, 0);

                const texture = new THREE.CanvasTexture(canvas);
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                return texture;
            }

            createAtmosphere(group, data) {
                const geo = new THREE.SphereGeometry(data.radius * 1.04, 32, 32);
                const color = new THREE.Color(data.atmosphereColor || '#4488ff');
                const mat = new THREE.ShaderMaterial({
                    transparent: true,
                    side: THREE.FrontSide,
                    depthWrite: false,
                    uniforms: {
                        color: { value: color },
                        intensity: { value: 0.3 }
                    },
                    vertexShader: `
                        varying vec3 vNormal;
                        void main() {
                            vNormal = normalize(normalMatrix * normal);
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform vec3 color;
                        uniform float intensity;
                        varying vec3 vNormal;
                        void main() {
                            float i = pow(0.6 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                            gl_FragColor = vec4(color, i * intensity);
                        }
                    `
                });
                const atmos = new THREE.Mesh(geo, mat);
                group.add(atmos);
            }

            createRings(group, data) {
                const ringGeo = new THREE.TorusGeometry(data.radius * 1.8, 0.06, 16, 100);
                const ringMat = new THREE.MeshStandardMaterial({
                    color: 0xc2b280,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.5,
                    roughness: 0.8,
                    metalness: 0.1
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2.2;
                ring.rotation.z = 0.3;
                group.add(ring);

                const ring2 = new THREE.TorusGeometry(data.radius * 2.2, 0.04, 16, 100);
                const ringMat2 = new THREE.MeshStandardMaterial({
                    color: 0x998866,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.3,
                    roughness: 0.9
                });
                const ring2Mesh = new THREE.Mesh(ring2, ringMat2);
                ring2Mesh.rotation.x = Math.PI / 2.3;
                ring2Mesh.rotation.z = 0.2;
                group.add(ring2Mesh);
            }

            createMoons(group, data) {
                const moonData = data.moons;
                moonData.forEach((name, index) => {
                    const dist = 0.5 + index * 0.25 + Math.random() * 0.15;
                    const size = 0.06 + Math.random() * 0.1;
                    const geo = new THREE.SphereGeometry(size, 16, 16);
                    const col = new THREE.Color().setHSL(0.08 + Math.random() * 0.05, 0.1, 0.4 + Math.random() *
                    0.3);
                    const mat = new THREE.MeshStandardMaterial({
                        color: col,
                        roughness: 0.9,
                        metalness: 0.0
                    });
                    const moon = new THREE.Mesh(geo, mat);
                    moon.userData = {
                        name: name,
                        type: 'Спутник',
                        diameter: `${(100 + Math.random() * 2000).toFixed(0)} км`,
                        mass: `${(Math.random() * 100).toFixed(1)} × 10²⁰ кг`,
                        temp: `${-200 + Math.random() * 150}°C`,
                        description: `${name} — спутник планеты ${data.name}.`,
                        facts: [`Спутник ${data.name}`, 'Исследуется учеными'],
                        color: col.getStyle(),
                        isMoon: true,
                        isPlanet: true,
                        parentName: data.name
                    };
                    moon.position.set(dist, (Math.random() - 0.5) * 0.2, 0);
                    group.add(moon);
                    this.clickableObjects.push(moon);

                    // Store for animation
                    if (!group.userData.moons) group.userData.moons = [];
                    group.userData.moons.push({
                        mesh: moon,
                        distance: dist,
                        speed: 0.02 + Math.random() * 0.03,
                        angle: Math.random() * Math.PI * 2,
                        name: name
                    });

                    // Label for moon
                    const label = this.createLabel(name, true);
                    label.position.set(0, size * 2 + 0.1, 0);
                    moon.add(label);
                });
            }

            createLabel(text, small = false) {
                const div = document.createElement('div');
                div.textContent = text;
                div.style.color = 'rgba(255,255,255,0.6)';
                div.style.fontSize = small ? '8px' : '10px';
                div.style.fontFamily = 'Segoe UI, sans-serif';
                div.style.fontWeight = '400';
                div.style.textShadow = '0 0 10px rgba(0,0,0,0.8)';
                div.style.pointerEvents = 'none';
                div.style.userSelect = 'none';
                div.style.letterSpacing = '0.5px';
                return new CSS2DObject(div);
            }

            createAsteroidBelt() {
                const count = 3000;
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);
                const sizes = new Float32Array(count);

                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const r = 15 + Math.random() * 3.5;
                    const y = (Math.random() - 0.5) * 1.5;
                    pos[i * 3] = r * Math.cos(angle);
                    pos[i * 3 + 1] = y;
                    pos[i * 3 + 2] = r * Math.sin(angle);
                    const c = new THREE.Color().setHSL(0.08, 0.1, 0.3 + Math.random() * 0.3);
                    colors[i * 3] = c.r;
                    colors[i * 3 + 1] = c.g;
                    colors[i * 3 + 2] = c.b;
                    sizes[i] = 0.02 + Math.random() * 0.04;
                }

                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

                const mat = new THREE.PointsMaterial({
                    size: 0.04,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.6,
                    sizeAttenuation: true

                    mesh: belt,

                    speed: 0.0003
                };

            createOrbits() {
                planetData.forEach(data => {
                    const points = [];
                    for (let i = 0; i <= 80; i++) {
                        const angle = (i / 80) * Math.PI * 2;
                        points.push(new THREE.Vector3(
                            data.distance * Math.cos(angle),
                            0,
                            data.distance * Math.sin(angle)
                        ));
                    }
                    const geo = new THREE.BufferGeometry().setFromPoints(points);
                    const mat = new THREE.LineBasicMaterial({
                        color: new THREE.Color(data.color),
                        transparent: true,
                        opacity: 0.08,
                        blending: THREE.AdditiveBlending
                    });
                    this.scene.add(new THREE.Line(geo, mat));

            }

            setupUI() {
                document.getElementById('searchBtn').addEventListener('click', () => this.searchPlanet());
                document.getElementById('searchInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.searchPlanet();
                });
                document.getElementById('closePanel').addEventListener('click', () => {
                    document.getElementById('infoPanel').classList.remove('active');
                });
                document.getElementById('speedSlider').addEventListener('input', (e) => {
                    this.speed = parseFloat(e.target.value);
                    document.getElementById('speedValue').textContent = this.speed.toFixed(1) + 'x';
                });
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.switchView(btn.dataset.view);
                    });
                });

                // FPS counter
                let frames = 0;
                let lastTime = performance.now();
                setInterval(() => {
                    const now = performance.now();
                    const fps = Math.round(frames / ((now - lastTime) / 1000));
                    document.getElementById('fpsDisplay').textContent = `FPS: ${fps}`;
                    frames = 0;
                    lastTime = now;
                }, 1000);
                this.fpsCounter = () => frames++;
            }

            searchPlanet() {
                const query = document.getElementById('searchInput').value.toLowerCase().trim();
                if (!query) return;

                let found = null;
                this.planets.forEach(group => {
                    group.children.forEach(child => {
                        if (child.userData.name && child.userData.name.toLowerCase().includes(query)) {
                            found = { mesh: child, group: group };
                        }
                    });
                });

                // Check moons
                if (!found) {
                    this.planets.forEach(group => {
                        group.children.forEach(child => {
                            if (child.userData.isMoon && child.userData.name.toLowerCase().includes(
                                query)) {
                                found = { mesh: child, group: group };
                            }
                        });
                    });
                }

                if (this.sun && this.sun.userData.name.toLowerCase().includes(query)) {
                    found = { mesh: this.sun, group: null };
                }

                if (found) {
                    const pos = found.group ? found.group.position.clone() : new THREE.Vector3(0, 0, 0);
                    const dist = found.mesh.userData.distance || 5;
                    const target = new THREE.Vector3(
                        pos.x + dist * 0.3,
                        dist * 0.25,
                        pos.z + dist * 0.3
                    );
                    this.animateCamera(target, pos);
                    this.showObjectInfo(found.mesh.userData);
                } else {
                    const input = document.getElementById('searchInput');
                    input.style.borderColor = '#ff4444';
                    setTimeout(() => input.style.borderColor = '', 1000);
                }
            }

            animateCamera(target, lookAt) {
                const startPos = this.camera.position.clone();
                const startTarget = this.controls.target.clone();
                const duration = 800;
                const startTime = Date.now();

                const anim = () => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const ease = 1 - Math.pow(1 - progress, 3);
                    this.camera.position.lerpVectors(startPos, target, ease);
                    this.controls.target.lerpVectors(startTarget, lookAt, ease);
                    this.controls.update();
                    if (progress < 1) requestAnimationFrame(anim);
                };
                anim();
            }

            switchView(view) {
                switch (view) {
                    case 'solar':
                        this.controls.autoRotate = false;
                        this.animateCamera(new THREE.Vector3(30, 22, 40), new THREE.Vector3(0, 0, 0));
                        break;
                    case 'orbit':
                        this.controls.autoRotate = true;
                        this.controls.autoRotateSpeed = 0.2;
                        this.animateCamera(new THREE.Vector3(0, 40, 60), new THREE.Vector3(0, 0, 0));
                        break;
                    case 'asteroids':
                        this.controls.autoRotate = false;
                        this.animateCamera(new THREE.Vector3(18, 3, 18), new THREE.Vector3(16, 0, 0));
                        break;
                    case 'galaxy':
                        this.controls.autoRotate = false;
                        this.animateCamera(new THREE.Vector3(0, 70, 130), new THREE.Vector3(0, 0, 0));
                        break;
                }
            }

            onMouseMove(event) {
                // Для эффекта подсветки при наведении (опционально)
            }

            onClick(event) {
                const rect = this.renderer.domElement.getBoundingClientRect();
                this.mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                this.mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                this.raycaster.setFromCamera(this.mouse, this.camera);
                const intersects = this.raycaster.intersectObjects(this.clickableObjects);

                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    let data = obj.userData;

                    if (!data.name && obj.parent) {
                        // Check parent for data
                        if (obj.parent.userData && obj.parent.userData.name) {
                            data = obj.parent.userData;
                        }
                        // Check if it's a moon
                        if (obj.parent.parent) {
                            obj.parent.parent.children.forEach(child => {
                                if (child.userData && child.userData.isMoon) {
                                    data = child.userData;
                                }
                            });
                        }
                    }

                    if (data && data.name) {
                        this.showObjectInfo(data);
                        // Highlight effect
                        if (obj.material && !obj.material.isLineBasicMaterial) {
                            const orig = obj.material.emissive ? obj.material.emissive.clone() : null;
                            obj.material.emissive = new THREE.Color(0xffffff);
                            obj.material.emissiveIntensity = 0.2;
                            setTimeout(() => {
                                if (obj.material) {
                                    obj.material.emissive = orig || new THREE.Color(0x000000);
                                    obj.material.emissiveIntensity = 0.05;
                                }
                            }, 400);
                        }
                    }
                }
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                if (this.fpsCounter) this.fpsCounter();

                const delta = this.clock.getDelta();
                const speed = this.speed;

                if (this.sun) {
                    this.sun.rotation.y += delta * 0.05 * speed;
                }

                this.planets.forEach((group) => {
                    let data = null;
                    group.children.forEach(child => {
                        if (child.userData && child.userData.isPlanet && !child.userData.isMoon) {
                            data = child.userData;
                        }
                    });

                    if (data && data.speed) {
                        data.angle += delta * data.speed * speed * 0.4;
                        const dist = data.distance;
                        group.position.x = dist * Math.cos(data.angle);
                        group.position.z = dist * Math.sin(data.angle);

                        group.children.forEach(child => {
                            if (child.isMesh && !child.userData.isMoon) {
                                child.rotation.y += delta * 0.2 * speed;
                            }
                        });

                        // Animate moons
                        if (group.userData.moons) {
                            group.userData.moons.forEach(moonData => {
                                moonData.angle += delta * moonData.speed * speed * 0.8;
                                const d = moonData.distance;
                                moonData.mesh.position.x = d * Math.cos(moonData.angle);
                                moonData.mesh.position.z = d * Math.sin(moonData.angle);
                                moonData.mesh.position.y = Math.sin(moonData.angle * 0.7) * 0.05;
                                moonData.mesh.rotation.y += delta * 0.1;
                            });
                        }
                    }
                });

                // Rotate asteroid belt
                if (this.asteroidData) {
                    this.asteroidData.angle += delta * this.asteroidData.speed * speed;
                    this.asteroidData.mesh.rotation.y = this.asteroidData.angle;
                }

                this.controls.update();
                this.renderer.render(this.scene, this.camera);
                this.labelRenderer.render(this.scene, this.camera);
            }

            onResize() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                this.camera.aspect = w / h;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(w, h);
                this.labelRenderer.setSize(w, h);
            }
        }

        // ============ ЗАПУСК ============
        const app = new SolarSystemApp();
        window.app = app;
        console.log('🚀 Solar System Explorer PRO загружен!');
        console.log('🪐 Все планеты, спутники, астероидный пояс');
        console.log('💫 Кликните по любому объекту для информации');
    </script>
</body>
</html>
